<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>王紹宇 Steven & 黃荑 Ti 的婚禮大調查</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <main class="row">
      <!-- bg -->
      <section class="columns half bg"></section>
      
      <!-- form -->
      <section class="columns half form">
        <div id="form-container">
          <span class="animation a1" id="title"><img src="images/form_title.jpg" alt="form title" height="150px" width="auto"></span>
          <form id="main-form">
            <!-- 姓名 -->
            <div class="input-group animation a2">
              <label for="demo_name">您的姓名</label>
              <input class="form-field" type="text" id="demo_name" required>
              <span class="icon"></span>
            </div>
            
            <!-- 關係 -->
            <div class="input-group animation a3">
              <label for="demo_name">您與我們的關係</label>
              <input class="form-field" type="text" id="relation" required>
              <span class="icon"></span>
            </div>
  
            <!-- 請問幾位 -->
            <div class="input-group animation a4">
              <label id="attend" for="demo_name">出席幾位 <small id="comment">記得把自己算進去呦</small></label>
              <input class="form-field" type="text" id="people-number" pattern="[0-9]{1,3}" required>
              <span class="icon"></span>
            </div>
  
            <!-- 是否吃素 -->
            <div class="input-group animation a5">
              <label>吃素的人數</label>
              <input class="form-field" type="text" id="demo_vegetarian" pattern="[0-9]{1,3}" required>
              <span class="icon"></span>
            </div>
  
            <!-- 是否需要兒童椅 -->
            <div class="input-group animation a6">
              <label>需要幾張兒童椅</label>
              <input class="form-field" type="text" id="demo_child_seat" pattern="[0-9]{1,3}" required>
              <span class="icon"></span>
            </div>
  
            <!-- 是否需要寄送喜帖 -->
            <div class="input-group animation a7">
              <label>您想要紙本喜帖或是電子喜帖</label>
              <div class="radio-group row">
                <!-- 紙本喜帖 -->
                <div class="four columns">
                  <input type="radio" id="paper" name="demo_invitation" value="紙本喜帖">
                  <label for="paper">紙本喜帖</label>
                </div>
  
                <!-- 電子喜帖 -->
                <div class="four columns">
                  <input type="radio" id="electronic" name="demo_invitation" value="電子喜帖">
                  <label for="electronic">電子喜帖</label>
                </div>

                <!-- 我都要 -->
                <div class="four columns">
                  <input type="radio" id="both" name="demo_invitation" value="我都要">
                  <label for="both">我都要</label>
                </div>

                <!-- 我都不要 -->
                <div class="four columns">
                  <input type="radio" id="none" name="demo_invitation" value="我都不要">
                  <label for="none">我都不要</label>
                </div>
              </div>
            </div>
  
            <!-- 電子郵件 -->
            <div class="input-group hidden-email" id="need-electronic">
                <label for="demo_email">聯絡Email</label>
                <input class="form-field" type="email" id="demo_email">
            </div>

            <!-- 地址 -->
            <div class="input-group hidden-address" id="need-paper">
                <label for="demo_address">地址</label>
                <input class="form-field" type="text" id="demo_address">
            </div>

            <!-- 想對我們說的話 -->
            <div class="input-group animation a8">
              <label for="demo_message">想對我們說的話</label>
              <input class="form-field" type="text" id="demo_message"></input>
              <span class="icon"></span>
            </div>
            <div class="button-container">
              <button type="button" id="submit" class="animation a9">送出</button>
            </div>
          
          </form>
          
          
          <div class="after-submit">
            <div id="loader" class="hidden">
              <img src="images/success2.jpg" width="128px" height="auto" alt="Steven">
            </div>
            <div id="thanks-msg" class="hidden">
              <img src="images/seeyouthen.jpg" height="100px" width="auto" alt="see you then">
            </div>
            <div id="success" class="hidden">
              <button type="button" id="return" class="button-primary u-full-width">返回填寫</button>
            </div>
          </div>
          
          
        </div>
        
      </section>
    </main>
  </div>

  <!-- <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script> -->
  <script src="script.js"></script>
  
</body>
</html>

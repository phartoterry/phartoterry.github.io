<body>

  <div class="container">
    <main class="row">
      <!-- bg -->
      <section class="six columns half bg"></section>
      
      <!-- form -->
      <section class="six columns half form">
        <!-- <h1>王紹宇 Steven & 黃荑 Ti 的婚禮大調查</h1> -->
        <span>王紹宇 Steven & 黃荑 Ti 的婚禮大調查</span>
        <form>
          <!-- 姓名 -->
          <div class="input-group">
            <label for="demo_name">尊姓大名</label>
            <input class="u-full-width" type="text" id="demo_name">
          </div>
          
          <!-- 關係 -->
          <div class="input-group">
            <label for="demo_name">您與新人的關係</label>
            <input class="u-full-width" type="text" id="relation">
          </div>

          <!-- 請問幾位 -->
          <div class="input-group">
            <label for="demo_name">請問幾位</label>
            <input class="u-full-width" type="text" id="people-number">
          </div>

          <!-- 是否吃素 -->
          <div class="input-group">
            <label>是否吃素</label>
            <div class="radio-group row">
              <!-- 是 -->
              <div class="four columns">
                <input type="radio" id="yes" name="demo_veg" value="yes">
                <label for="yes">是</label>
              </div>

              <!-- 否 -->
              <div class="four columns">
                <input type="radio" id="no" name="demo_veg" value="no" checked>
                <label for="no">否</label>
              </div>
            </div>
          </div>

          <!-- 是否需要兒童椅 -->
          <div class="input-group">
            <label>是否需要兒童椅</label>
            <div class="radio-group row">
              <!-- 是 -->
              <div class="four columns">
                <input type="radio" id="yes" name="demo_child_chair" value="yes">
                <label for="yes">是</label>
              </div>

              <!-- 否 -->
              <div class="four columns">
                <input type="radio" id="no" name="demo_child_chair" value="no" checked>
                <label for="no">否</label>
              </div>
            </div>
          </div>

          <!-- 是否需要寄送喜帖 -->
          <div class="input-group">
            <label>是否需要寄送喜帖</label>
            <div class="radio-group row">
              <!-- 是 -->
              <div class="four columns">
                <input type="radio" id="yes" name="demo_invitation" value="yes">
                <label for="yes">是</label>
              </div>

              <!-- 否 -->
              <div class="four columns">
                <input type="radio" id="no" name="demo_invitation" value="no" checked>
                <label for="no">否</label>
              </div>
            </div>
          </div>

            <!-- 電子郵件 -->
            <div class="input-group">
                <label for="demo_email">電子郵件</label>
                <input class="u-full-width" type="email" id="demo_email">
            </div>

          <!-- 詢問類別 -->
          <!-- <div class="input-group">
            <label for="demo_select">詢問類別</label>
            <select class="u-full-width" id="demo_select">
              <option value="0" value="0" selected disabled>請選擇</option>
              <option value="cat">貓類</option>
              <option value="dog">狗類</option>
              <option value="bear">熊類</option>
            </select>
          </div> -->

          <!-- 詢問內容 -->
          <!-- <div class="input-group">
            <label for="demo_textarea">詢問內容</label>
            <textarea class="u-full-width" id="demo_textarea"></textarea>
          </div> -->

          <button type="button" id="submit" class="button-primary u-full-width">確認送出</button>

        </form>
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="script.js"></script>
  
</body>
</html>

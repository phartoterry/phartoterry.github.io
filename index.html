<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>王紹宇 Steven & 黃荑 Ti 的婚禮大調查</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Google Tag Manager -->
  <script>

      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-N97VV92M');
  </script>

</head>
<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N97VV92M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <main class="row">
      <!-- bg -->
      <section class="six columns half bg"></section>
      
      <!-- form -->
      <section class="six columns half form">
        <div id="form-container">
          <span id="title">Please let us know...</span>
          <form id="main-form">
            <!-- 姓名 -->
            <div class="input-group">
              <label for="demo_name">您的姓名</label>
              <input class="u-full-width" type="text" id="demo_name">
            </div>
            
            <!-- 關係 -->
            <div class="input-group">
              <label for="demo_name">您與我們的關係</label>
              <input class="u-full-width" type="text" id="relation">
            </div>
  
            <!-- 請問幾位 -->
            <div class="input-group">
              <label id="attend" for="demo_name">出席幾位</label>
              <span id="comment">記得把自己算進去呦</span>
              <input class="u-full-width" type="text" id="people-number">
            </div>
  
            <!-- 是否吃素 -->
            <div class="input-group">
              <label>吃素的人數</label>
              <input class="u-full-width" type="text" id="demo_vegetarian">
            </div>
  
            <!-- 是否需要兒童椅 -->
            <div class="input-group">
              <label>需要幾張兒童椅</label>
              <input class="u-full-width" type="text" id="demo_child_seat">
            </div>
  
            <!-- 是否需要寄送喜帖 -->
            <div class="input-group">
              <label>您想要紙本喜帖或是電子喜帖</label>
              <div class="radio-group row">
                <!-- 紙本喜帖 -->
                <div class="four columns">
                  <input type="radio" id="paper" name="demo_invitation" value="紙本喜帖">
                  <label for="paper">紙本喜帖</label>
                </div>
  
                <!-- 電子喜帖 -->
                <div class="four columns">
                  <input type="radio" id="electronic" name="demo_invitation" value="電子喜帖">
                  <label for="electronic">電子喜帖</label>
                </div>

                <!-- 我都要 -->
                <div class="four columns">
                  <input type="radio" id="both" name="demo_invitation" value="我都要">
                  <label for="both">我都要</label>
                </div>

                <!-- 我都不要 -->
                <div class="four columns">
                  <input type="radio" id="none" name="demo_invitation" value="我都不要">
                  <label for="none">我都不要</label>
                </div>
              </div>
            </div>
  
            <!-- 電子郵件 -->
            <div class="input-group hidden-email" id="need-electronic">
                <label for="demo_email">聯絡Email</label>
                <input class="u-full-width" type="email" id="demo_email">
            </div>

            <!-- 地址 -->
            <div class="input-group hidden-address" id="need-paper">
              <label for="demo_address">地址</label>
              <input class="u-full-width" type="text" id="demo_address">
            </div>

            <!-- 想對我們說的話 -->
            <div class="input-group">
              <label for="demo_message">想對我們說的話</label>
              <input class="u-full-width" type="text" id="demo_message"></input>
            </div>
  
            <button type="button" id="submit" class="button-primary u-full-width">送</button>
          </form>

          <div class="after-submit">
            <div id="loader" class="hidden">
              <img src="images/success.jpg" width="64px" height="64px" id="Steven">
            </div>
            <span id="thanks-msg" class="hidden">謝謝您的填寫</span>
            <div id="success" class="hidden">
              <button type="button" id="return" class="button-primary u-full-width">返回填寫</button>
            </div>
          </div>
          
          
        </div>
        
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="script.js"></script>
  
</body>
</html>

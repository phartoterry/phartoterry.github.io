<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>王紹宇 Steven & 黃荑 Ti 的婚禮大調查</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-N97VV92M');
  </script>

</head>
<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N97VV92M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <main class="row">
      <!-- bg -->
      <section class="six columns half bg"></section>
      
      <!-- form -->
      <section class="six columns half form">
        <div id="form-container">
          <span>Please let us know...</span>
          <form id="main-form">
            <!-- 姓名 -->
            <div class="input-group">
              <label for="demo_name">您的姓名</label>
              <input class="u-full-width" type="text" id="demo_name">
            </div>
            
            <!-- 關係 -->
            <div class="input-group">
              <label for="demo_name">您與我們的關係</label>
              <input class="u-full-width" type="text" id="relation">
            </div>
  
            <!-- 請問幾位 -->
            <div class="input-group">
              <label for="demo_name">出席幾位</label>
              <input class="u-full-width" type="text" id="people-number">
            </div>
  
            <!-- 是否吃素 -->
            <div class="input-group">
              <label>是否吃素</label>
              <div class="radio-group row">
                <!-- 是 -->
                <div class="two columns">
                  <input type="radio" id="yes" name="demo_veg" value="yes">
                  <label for="yes">是</label>
                </div>
  
                <!-- 否 -->
                <div class="two columns">
                  <input type="radio" id="no" name="demo_veg" value="no" checked>
                  <label for="no">否</label>
                </div>
              </div>
            </div>
  
            <!-- 是否需要兒童椅 -->
            <div class="input-group">
              <label>是否需要兒童椅</label>
              <div class="radio-group row">
                <!-- 是 -->
                <div class="two columns">
                  <input type="radio" id="yes" name="demo_child_chair" value="yes">
                  <label for="yes">是</label>
                </div>
  
                <!-- 否 -->
                <div class="two columns">
                  <input type="radio" id="no" name="demo_child_chair" value="no" checked>
                  <label for="no">否</label>
                </div>
              </div>
            </div>
  
            <!-- 是否需要寄送喜帖 -->
            <div class="input-group">
              <label>是否需要寄送喜帖</label>
              <div class="radio-group row">
                <!-- 是 -->
                <div class="two columns">
                  <input type="radio" id="yes" name="demo_invitation" value="yes">
                  <label for="yes">是</label>
                </div>
  
                <!-- 否 -->
                <div class="two columns">
                  <input type="radio" id="no" name="demo_invitation" value="no" checked>
                  <label for="no">否</label>
                </div>
              </div>
            </div>
  
            <!-- 電子郵件 -->
            <div class="input-group">
                <label for="demo_email">Email</label>
                <input class="u-full-width" type="email" id="demo_email">
            </div>
  
            <button type="button" id="submit" class="button-primary u-full-width">送</button>
          </form>
          
          <div id="loader" class="hidden btn btn-inside btn-boarder">
            <img src="https://i.cloudup.com/gBzAn-oW_S-2000x2000.png" width="64px" height="64px" id="plane">
          </div>
          <div id="success" class="hidden">
            <img src="https://i.cloudup.com/2ZAX3hVsBE-3000x3000.png" id="check" width="32px" height="32px" style="opacity:0;">
            <div class="around around-boarder"></div>
            <button type="button" id="return" class="button-primary u-full-width">返回填寫</button>
          </div>
        </div>
        
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
